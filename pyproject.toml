[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webstudio"
version = "0.1.0"
description = "Home-network web studio for Qwen-Image-2.1-Heretic MLX image generation and editing."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mflux @ https://github.com/vanch007/mflux/archive/3d494b7866a221213a3eedb5ae6b995556564960.tar.gz",
    "huggingface_hub>=1.1.6,<2.0",
    "pillow>=12.3.0",
    "fastapi",
    "uvicorn[standard]",
    "mlx-vlm>=0.7.4",
]

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["webstudio"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
gui = ["pywebview>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
